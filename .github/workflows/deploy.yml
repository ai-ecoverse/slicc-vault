name: Preview

on:
  push:
    branches-ignore: [main, 'gh-readonly-queue/**']

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEFTHOOK: '0'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Publish vault-<branch>.sliccy.ai
        env:
          VAULT_VERSION: 0.0.0-${{ github.sha }}
        shell: bash
        run: |
          npm run build
          node edge/publish.mjs | tee -a "$GITHUB_STEP_SUMMARY" | grep '^publish: PASS '
