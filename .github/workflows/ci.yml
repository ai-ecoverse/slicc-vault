name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write
  statuses: write
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/pipeline.yml@v2.13.3
    secrets: inherit
    with:
      node-version: '26'
      test-glob: test/integration/*.test.mjs
      deploy: |
        set -eo pipefail
        export VAULT_VERSION="0.0.0-$GITHUB_SHA"
        npm run build
        verdict="$(node edge/publish.mjs | tee -a "$GITHUB_STEP_SUMMARY" | grep '^publish: PASS https://')"
        read -r _ _ url _ <<< "$verdict"
        echo "url=$url" >> "$GITHUB_OUTPUT"
      release-environment: production
      after-release: |
        set -eo pipefail
        export VAULT_VERSION="$RELEASE_VERSION"
        npm run build
        node edge/publish.mjs | tee -a "$GITHUB_STEP_SUMMARY" | grep '^publish: PASS https://'
